
name: Unpack Ozero Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          ZIP="Ozero-clikerapk-main.zip"

          if [ ! -f "$ZIP" ]; then
            echo "Архив не найден!"
            ls -la
            exit 1
          fi

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o Ozero-clikerapk-main.zip -d extracted

      - name: Copy project files
        run: |
          cp -a extracted/Ozero-clikerapk-main/. .

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Extract Ozero project archive"
            git push
          else
            echo "Изменений нет"
          fi
