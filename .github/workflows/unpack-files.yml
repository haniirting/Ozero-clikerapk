
name: Unpack Ozero Files

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Путь к ZIP-архиву"
        required: true
        default: "uploads/Ozero-FDroid-files.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        env:
          ZIP_PATH: ${{ inputs.zip_path }}
        run: |
          if [ ! -f "$ZIP_PATH" ]; then
            echo "Архив не найден: $ZIP_PATH"
            echo "Содержимое репозитория:"
            find . -maxdepth 3 -type f
            exit 1
          fi

      - name: Extract ZIP
        env:
          ZIP_PATH: ${{ inputs.zip_path }}
        run: |
          mkdir extracted
          unzip -o "$ZIP_PATH" -d extracted

      - name: Copy files
        run: |
          find extracted -type f -name index.html \
            -exec cp {} www/index.html \;

          find extracted -type f -path '*/android/build.gradle' \
            -exec cp {} android/build.gradle \;

          find extracted -type f -path '*/android/app/build.gradle' \
            -exec cp {} android/app/build.gradle \;

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/index.html android/build.gradle android/app/build.gradle
          git diff --cached --quiet || (
            git commit -m "Apply F-Droid files"
            git push
          )
