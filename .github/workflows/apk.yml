name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mkdir -p www && cp "$(find . -name index.html -not -path "./node_modules/*" -not -path "./www/*" | head -1)" www/index.html
      - run: npm install
      - run: echo '{"appId":"com.ozero.taptap","appName":"Озеро","webDir":"www"}' > capacitor.config.json
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Озеро (APK)
          files: android/app/build/outputs/apk/debug/app-debug.apk
