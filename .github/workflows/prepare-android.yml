
name: Prepare Android project for F-Droid

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Prepare Capacitor
        run: |
          mkdir -p www
          cp index.html www/index.html

          npx cap sync android

      - name: Verify Android assets
        run: |
          test -f android/app/src/main/assets/public/index.html
          echo "Web assets verified!"

      - name: Build APK files
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease

      - name: Generate checksums
        run: |
          cd android/app/build/outputs/apk
          find debug release -name "*.apk" -exec sha256sum {} \; \
            > "$GITHUB_WORKSPACE/SHA256SUMS.txt"

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: Ozero-Android-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
