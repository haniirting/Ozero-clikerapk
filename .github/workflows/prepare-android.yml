name: Prepare Android
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: mkdir -p www && cp index.html www/
      - run: npm install
      - run: echo '{"appId":"com.ozero.taptap","appName":"Озеро","webDir":"www"}' > capacitor.config.json
      - run: npx cap add android
      - name: Bluetooth permissions
        run: |
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.BLUETOOTH" /><uses-permission android:name="android.permission.BLUETOOTH_ADMIN" /><uses-permission android:name="android.permission.BLUETOOTH_SCAN" /><uses-permission android:name="android.permission.BLUETOOTH_CONNECT" /><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" /></manifest>#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Commit android folder
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f android capacitor.config.json
          git commit -m "Add Android project" || echo "nothing to commit"
          git push
