
name: Prepare Android project for F-Droid

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web assets and Capacitor config
        run: |
          mkdir -p www
          cp index.html www/index.html

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ozero.taptap",
            "appName": "Озеро",
            "webDir": "www"
          }
          EOF

      - name: Install dependencies and create lock file
        run: npm install

      - name: Generate and sync Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Commit Android project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add android package-lock.json capacitor.config.json www/index.html

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Prepare Android project for F-Droid"
            git push
          fi
