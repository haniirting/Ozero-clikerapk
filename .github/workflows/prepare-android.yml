
name: Build and Publish Ozero

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Prepare Capacitor
        run: |
          mkdir -p www
          cp index.html www/index.html
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease

      - name: Prepare release files
        id: apk
        run: |
          mkdir -p release-files

          find android/app/build/outputs/apk \
            -type f -name "*.apk" \
            -exec cp {} release-files/ \;

          if ! ls release-files/*.apk >/dev/null 2>&1; then
            echo "APK files not found!"
            exit 1
          fi

          cd release-files
          sha256sum *.apk > SHA256SUMS.txt

          echo "tag=v1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.apk.outputs.tag }}"

          gh release create "$TAG" \
            release-files/*.apk \
            release-files/SHA256SUMS.txt \
            --title "Озеро $TAG" \
            --notes "Автоматическая сборка Android приложения Озеро.

          Вложения:
          - Debug APK для тестирования
          - Release APK для дальнейшей проверки
          - SHA256 контрольные суммы

          Сборка: $GITHUB_SHA" \
            --prerelease

      - name: Show release URL
        run: |
          gh release view "${{ steps.apk.outputs.tag }}" \
            --json url --jq .url
